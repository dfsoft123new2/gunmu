<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棍母</title> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#eeeeeb; --ink:#1c1c1f; --ink-2:#5d5e64; --ink-3:#9a9ba1; --line:#d9d9d4; --line-2:#c4c4be;
  --cw:#ffffff; --cr:#cf2f2b; --cg:#1b8a4c; --cb:#2560c8; --cy:#9c7200; --cc:#0a858f; --cm:#bb1f8b; --ck:#000000; --gray:#8c8d92;
  --w-chip:#1c1c1f; --k-chip:transparent; --k-fg:#000;
  --ff-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --ff-glyph:"ZCOOL XiaoWei","Songti SC","STSong","SimSun",serif;
  --ff-num:"Space Grotesk","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101113; --surface:#17181b; --surface-2:#1e1f23; --ink:#ececed; --ink-2:#a3a4aa; --ink-3:#6b6c72; --line:#2b2c31; --line-2:#3a3b41;
    --cw:#f4f4f1; --cr:#ff6464; --cg:#55d888; --cb:#6ea9ff; --cy:#ffd548; --cc:#4fe2e2; --cm:#ff70d8; --ck:#000000; --gray:#8a8b90;
    --w-chip:transparent; --k-chip:#ececed; --k-fg:#000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101113; --surface:#17181b; --surface-2:#1e1f23; --ink:#ececed; --ink-2:#a3a4aa; --ink-3:#6b6c72; --line:#2b2c31; --line-2:#3a3b41;
  --cw:#f4f4f1; --cr:#ff6464; --cg:#55d888; --cb:#6ea9ff; --cy:#ffd548; --cc:#4fe2e2; --cm:#ff70d8; --ck:#000000; --gray:#8a8b90;
  --w-chip:transparent; --k-chip:#ececed; --k-fg:#000;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ff-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
h2,h3{margin:0;font-weight:600}

/* —— 数字：只有颜色 —— */
.n{font-family:var(--ff-num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;letter-spacing:.01em}
.n-w{color:var(--cw);background:var(--w-chip);padding:0 .3em;border-radius:.22em}
.n-r{color:var(--cr)} .n-g{color:var(--cg)} .n-b{color:var(--cb)}
.n-y{color:var(--cy)} .n-c{color:var(--cc)} .n-m{color:var(--cm)}
.n-k{color:var(--k-fg);background:var(--k-chip);padding:0 .3em;border-radius:.22em}
.n-t{color:transparent;border-bottom:1px dashed var(--line-2);padding:0 .15em}
.n-t::selection{color:var(--ink);background:var(--surface-2)}
.peek .n-t{color:color-mix(in srgb,var(--ink) 16%,transparent)}
.dot{display:inline-block;width:.72em;height:.72em;border-radius:50%;vertical-align:-.06em;margin:0 .08em}
.d-w{background:var(--cw);box-shadow:inset 0 0 0 1.5px var(--ink)}
.d-r{background:var(--cr)} .d-g{background:var(--cg)} .d-b{background:var(--cb)}
.d-y{background:var(--cy)} .d-c{background:var(--cc)} .d-m{background:var(--cm)}
.d-k{background:var(--ck);box-shadow:inset 0 0 0 1.5px var(--ink)}
.d-t{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.colorless .n{color:var(--gray)!important;background:none!important}
.colorless .dot{background:var(--gray)!important;box-shadow:none!important}
.colorless .ray{stroke:var(--gray)!important}

/* —— 布局 —— */
#app{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:baseline;gap:20px;padding:18px 28px 6px}
.top h1{margin:0;font-family:var(--ff-glyph);font-weight:400;font-size:34px;line-height:1;letter-spacing:.06em;cursor:default;user-select:none;white-space:nowrap}
#ticker{flex:1;min-width:0;color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .5s}
#bank{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:22px;padding:10px 28px 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#bank::-webkit-scrollbar{display:none}
.bk{display:flex;flex-direction:column;line-height:1.15;flex:none}
.bk .n{font-size:21px}
.bk small{font-size:11px;color:var(--ink-3);font-family:var(--ff-num);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:3px}
.bk.big .n{font-size:28px}
.bk.new .n{animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

.main{flex:1;display:grid;grid-template-columns:64px minmax(280px,340px) minmax(0,1fr);min-height:0}
#rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 0;border-right:1px solid var(--line)}
.tab{position:relative;width:44px;height:44px;border-radius:50%;font-family:var(--ff-glyph);font-size:23px;line-height:44px;text-align:center;color:var(--ink-3);transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tab[hidden]{display:none}
.tab.fresh::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.tab .tip{display:none}

#stage{position:relative;border-right:1px solid var(--line);padding:26px 24px 24px;display:flex;flex-direction:column;align-items:center;min-height:0}
#pocket{position:relative;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#pocket .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--ink);transition:border-color .2s}
#pocket .glyph{font-family:var(--ff-glyph);font-size:74px;line-height:1;transition:transform .08s}
#pocket:active .glyph{transform:scale(.92)}
#pocket.nohand .ring{border-color:var(--ink-3)}
#pocket.nohand .glyph{color:var(--ink-3)}
.stagestats{margin-top:18px;text-align:center;font-size:13px;color:var(--ink-2);display:grid;gap:4px}
.stagestats .n{font-size:15px}
.idlebar{width:180px;height:4px;margin:10px auto 0;background:var(--surface-2);border-radius:2px;overflow:hidden}
.idlebar i{display:block;height:100%;width:0;background:var(--ink-2)}
#junklayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.junk{position:absolute;pointer-events:auto;padding:7px 12px;background:var(--surface);border:1.5px solid var(--ink);border-radius:3px;font-size:13px;line-height:1.3;transform:rotate(-4deg);animation:drop .35s ease-out;box-shadow:3px 3px 0 var(--line-2)}
.junk b{display:block;font-weight:600}
.junk span{font-size:11px;color:var(--ink-3)}
.junk:hover{transform:rotate(-1deg) scale(1.04)}
@keyframes drop{from{transform:translateY(-18px) rotate(-12deg);opacity:0}to{transform:rotate(-4deg);opacity:1}}
.floater{position:fixed;pointer-events:none;z-index:40;font-size:17px;animation:rise .9s ease-out forwards}
@keyframes rise{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(-50%,-160%);opacity:0}}
#log{margin-top:22px;width:100%;flex:1;min-height:120px;overflow:hidden;font-size:13px;line-height:1.55;color:var(--ink-2);mask-image:linear-gradient(to bottom,#000 55%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent)}
#log p{padding:5px 0;border-top:1px dashed var(--line)}
#log p:first-child{color:var(--ink)}
#log .n{font-weight:600}

#panel{padding:26px 32px 60px;min-width:0}
.pane{display:none;max-width:860px}
.pane.on{display:block}
.pane>header{margin-bottom:18px}
.pane>header h2{font-family:var(--ff-glyph);font-weight:400;font-size:28px;letter-spacing:.04em;line-height:1.2}
.pane>header p{color:var(--ink-2);font-size:14px;margin-top:6px;max-width:62ch}
.sect{margin-top:30px}
.sect>h3{font-size:14px;color:var(--ink-2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.sect>h3 .seg{margin-left:auto}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* 按钮：买得起是实线，买不起是虚线 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:6px 14px;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface);font-size:14px;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--surface-2)}
.btn.no,.btn:disabled{border-style:dashed;border-color:var(--line-2);color:var(--ink-3);cursor:default;background:transparent}
.btn.no .n,.btn:disabled .n{opacity:.75}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--ink-2)}
.btn.solid.no,.btn.solid:disabled{background:transparent;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--ink);width:16px;height:16px}

/* 空 */
.gens{border-top:1px solid var(--line)}
.gen{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.gen .nm{font-weight:600;font-size:15.5px}
.gen .cnt{font-family:var(--ff-num);font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink-2);margin-left:8px;font-size:14px}
.gen .ds{font-size:12.5px;color:var(--ink-3)}
.gen .pr{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.gen .btn{grid-row:1/span 3;grid-column:2;min-width:132px}
.gen.ghost{opacity:.55}
.gen.ghost .nm{letter-spacing:.3em}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;border:1.5px solid var(--ink);border-radius:8px;background:var(--surface);min-height:104px}
.card:hover{background:var(--surface-2)}
.card .nm{font-weight:600;font-size:14.5px}
.card .ds{font-size:12.5px;color:var(--ink-2);flex:1;line-height:1.5}
.card .cs{font-size:13px}
.card.no{border-style:dashed;border-color:var(--line-2);cursor:default;background:transparent}
.card.no .nm,.card.no .ds{color:var(--ink-3)}
.card.own{border-style:solid;border-color:var(--line);background:transparent;cursor:default}
.card.own .cs{color:var(--ink-3);font-size:12px}
.empty{padding:16px 0;color:var(--ink-3);font-size:13px}

/* 光 */
.prism{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.tri{width:100%;max-width:320px;touch-action:none;user-select:none;-webkit-user-select:none}
.tri .face{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.tri .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;fill:none}
.tri .handle{fill:var(--bg);stroke:var(--ink);stroke-width:2;cursor:grab}
.tri text{font-family:var(--ff-num);font-size:13px;fill:var(--ink-2)}
.beam{width:100%;max-width:360px;display:block}
.beam .in{stroke:var(--ink-2);stroke-width:3}
.beam .glass{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.ray{stroke-linecap:round;fill:none}
.colorrows{display:grid;gap:12px;margin-top:6px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
.crow .n{font-size:19px}
.crow .ef{font-size:13px;color:var(--ink-2)}
.crow .rt{font-size:12px;color:var(--ink-3);font-family:var(--ff-num)}
.slider{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:13px;color:var(--ink-2)}
.slider input{flex:1;accent-color:var(--ink)}

/* 调 */
.pipe{display:grid;grid-template-columns:auto auto auto auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.pipe .op{color:var(--ink-3);font-family:var(--ff-num)}
.pipe .n{font-size:17px}
.pipe .pv{font-size:12.5px;color:var(--ink-3);text-align:right}

/* 抽 */
.gacha{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.machine{width:200px}
.machine svg{width:100%;display:block}
.machine .shell{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.machine .cap{fill:none;stroke:var(--ink-3);stroke-width:1.3;stroke-dasharray:3 3}
.machine.spin .caps{animation:shake .35s ease}
@keyframes shake{25%{transform:translate(3px,-2px) rotate(2deg)}50%{transform:translate(-3px,1px) rotate(-2deg)}75%{transform:translate(2px,2px)}}
.pullbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:96px;margin-top:4px}
.pc{width:76px;height:96px;border:1.5px dashed var(--line-2);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--ink-3);text-align:center;padding:6px;animation:flip .35s ease both}
.pc.color{border-style:solid;border-color:var(--line-2)}
.pc.color .n{font-size:12.5px}
.pc.junk{border-style:solid;border-color:var(--ink-2);color:var(--ink-2)}
.pc.relic{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-family:var(--ff-glyph);font-size:15px;line-height:1.25}
.pc.relic small{font-family:var(--ff-ui);font-size:10.5px;opacity:.75}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.relic{padding:12px 14px;border:1.5px solid var(--ink);border-radius:8px}
.relic .nm{font-family:var(--ff-glyph);font-size:19px;line-height:1.2}
.relic .lv{float:right;font-family:var(--ff-num);font-size:12px;color:var(--ink-2);margin-top:4px}
.relic .q{font-size:12px;color:var(--ink-3);margin-top:4px}
.relic .ef{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.relic.unknown{border-style:dashed;border-color:var(--line-2)}
.relic.unknown .nm{color:var(--ink-3);letter-spacing:.3em}
.pips{display:flex;gap:3px;margin-top:8px}
.pips i{width:14px;height:3px;background:var(--line);border-radius:1px}
.pips i.on{background:var(--ink)}

/* 呆 */
.idlebox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.face{font-family:var(--ff-num);font-size:44px;text-align:center;padding:26px 0;border:1.5px dashed var(--line-2);border-radius:12px;white-space:nowrap;overflow:hidden}
.bigbar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:10px}
.bigbar i{display:block;height:100%;background:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-family:var(--ff-num);font-variant-numeric:tabular-nums}

/* 格 */
.boardwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.board{display:grid;gap:6px;justify-content:start}
.cell{width:62px;height:62px;border:1.5px dashed var(--line-2);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .1s}
.cell:hover{background:var(--surface-2)}
.cell.f{border-style:solid;border-color:var(--ink)}
.cell .g{font-size:26px;font-family:var(--ff-num)}
.cell .v{font-size:10.5px;color:var(--ink-3);margin-top:5px;font-family:var(--ff-num)}
.inv{display:grid;gap:8px}
.piece{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1.5px solid var(--line-2);border-radius:8px;text-align:left}
.piece[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.piece .g{font-size:24px;font-family:var(--ff-num);text-align:center}
.piece .ds{font-size:12px;color:var(--ink-2);line-height:1.45}
.piece .c{font-family:var(--ff-num);font-size:15px}

/* 零 */
.zero{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:22px;border:1.5px solid var(--ink);border-radius:10px}
.zero .btn{min-height:52px;font-size:17px;padding:8px 26px}
.zero .gain .n{font-size:26px}

/* 无 */
.chs{display:grid;gap:10px}
.ch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;padding:14px 16px;border:1.5px solid var(--line-2);border-radius:8px;align-items:center}
.ch .nm{font-family:var(--ff-glyph);font-size:21px}
.ch .ds{font-size:13px;color:var(--ink-2)}
.ch .rw{font-size:12.5px;color:var(--ink-3)}
.ch .btn{grid-row:1/span 3;grid-column:2}
.ch.done{border-style:solid;border-color:var(--ink)}
.ch.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stamp{font-size:12px;border:1px solid var(--ink);border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:3px}

/* 透 */
.tbig{font-size:54px;line-height:1.1;display:inline-block;min-width:3ch}

/* 录 */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;min-height:72px}
.ach .nm{font-weight:600;font-size:13.5px}
.ach .ds{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.ach.lock{border-style:dashed;border-color:var(--line-2)}
.ach.lock .nm,.ach.lock .ds{color:var(--ink-3)}

.rowline{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
textarea{width:100%;min-height:90px;font-family:var(--ff-num);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:6px;padding:8px}

/* 提示与弹窗 */
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;max-width:320px}
.toast{padding:11px 14px;background:var(--ink);color:var(--bg);border-radius:8px;font-size:13px;line-height:1.45;animation:tin .3s ease}
.toast b{display:block;font-size:14px}
.toast .n{filter:none}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#modal{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;padding:20px}
#modal[hidden]{display:none}
.mbox{max-width:440px;width:100%;background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:24px}
.mbox h3{font-family:var(--ff-glyph);font-weight:400;font-size:24px;margin-bottom:10px}
.mbox .bd{font-size:14px;color:var(--ink-2);line-height:1.7}
.mbox .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
#ending{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
#ending[hidden]{display:none}
#ending .lines{font-family:var(--ff-glyph);font-size:clamp(22px,4vw,34px);line-height:1.9}

function trimZ(s){ return s.indexOf('.')>=0 ? s.replace(/\.?0+$/,'') : s; }
function fmt(n){
  if (n!==n) return '0';
  if (!isFinite(n)) return '∞';
  if (n<0) return '-'+fmt(-n);
  if (n<1e4){
    if (n<10) return trimZ(n.toFixed(2));
    if (n<100) return trimZ(n.toFixed(1));
    return Math.floor(n).toString();
  }
  const e = Math.floor(Math.log10(n));
  if ((S && S.opt && S.opt.fmt==='sci') || e>=72){
    let m = n/Math.pow(10,e); if (m>=9.995){ m=1; return '1.00e'+(e+1); }
    return m.toFixed(2)+'e'+e;
  }
  const u = Math.floor(e/4);
  const v = n/Math.pow(10,u*4);
  let s = v<10 ? v.toFixed(2) : v<100 ? v.toFixed(1) : v<1000 ? Math.floor(v).toString() : Math.floor(v).toString();
  return s+CN_UNITS[u];
}
function fx(n){ return n<1000 ? trimZ(n.toFixed(2)) : fmt(n); } // 倍率
function fmtTime(s){
  s=Math.floor(s);
  if (s<60) return s+' 秒';
  if (s<3600) return Math.floor(s/60)+' 分 '+(s%60)+' 秒';
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  if (h<24) return h+' 小时 '+m+' 分';
  return Math.floor(h/24)+' 天 '+(h%24)+' 小时';
}

}

  const n=boardSize(), cells=S.board.cells, out=new Array(25).fill(0);

  const nb=(i)=>{ const r=Math.floor(i/5), c=i%5, a=[]; if(r>0)a.push(i-5); if(r<n-1)a.push(i+5); if(c>0)a.push(i-1); if(c<n-1)a.push(i+1); return a; };
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    const i=r*5+c; if (cells[i]!==1) continue;
    let h=0,f=0; for (const j of nb(i)){ if(cells[j]===1)h++; else if(cells[j]===2)f++; }
    out[i]=(0.1+0.08*h)*Math.pow(1.8,f)*deep;
  }
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    const i=r*5+c; if (cells[i]!==3) continue;
    let best=0, f=0; for (const j of nb(i)){ if (cells[j]===1 && out[j]>best) best=out[j]; if (cells[j]===2) f++; }
    out[i]=best*Math.pow(1.8,f);
  }
  return out;
}
function boardMult(){
  const arr=boardContribs(); let s=0; for (const v of arr) s+=v;
  return 1+s*(1+0.2*rl(8));
}

function deepCost(){ return 1e4*Math.pow(100, S.board.deep); }

}

function buffM(type){ const b=S.buffs[type]; return b && b.t>0 ? b.m : 1; }

function globalMult(){
  let m=1;
  if (has('a1')) m*=1.5; if (has('a2')) m*=2; if (has('a3')) m*=2; if (has('a4')) m*=3;
  if (has('a5')) m*=Math.pow(1.2, seenColors());
  m*=achMult()*greenEff()*idleMult()*boardMult()*(1+0.25*rl(10))*(1+0.02*S.overflow);
  m*=blackEff()*Math.pow(2,S.kr)*tEff()*buffM('prod');
  if (S.junk.active) m*=0.85;
  return m;
}
function costGrowth(){ if (inCh(4)) return 1.35; return chDone(4)?1.14:1.15; }
function costDiv(){ return blueEff()*(1+rl(5)); }
function genMult(i){
  let m=Math.pow(chDone(3)?2.2:2, Math.floor(S.gens[i]/25));
  if (has('g'+i+'a')) m*=3; if (has('g'+i+'b')) m*=3;
  return m*(1+0.3*rl(2));
}
function genProdEach(i){ return GENS[i].p*genMult(i); }
function wpsBase(){ let b=0; for (let i=0;i<GENS.length;i++) b+=S.gens[i]*genProdEach(i); return b; }
function wpsGross(){
  let v=wpsBase()*globalMult();
  if (inCh(5) && v>1) v=Math.pow(v,0.6);
  if (chDone(5) && v>1) v=Math.pow(v,1.02);

}
function prismMax(){ return has('p2')?0.8:0.5; }
function prismPct(){ if (!has('prism')||inCh(2)) return 0; return Math.min(S.prism.pct, prismMax()); }
function wpsNet(){ return wpsGross()*(1-prismPct()); }
function prismEff(){
  let e=1; if (has('p1')) e*=2; if (has('p3')) e*=3; if (has('a6')) e*=3;
  e*=(1+0.5*rl(6)); if (chDone(2)) e*=3;
  if (has('x3')) e*=1+Math.log10(1+S.y+S.c+S.m);
  if (has('cy3')) e*=Math.sqrt(idleMult());

}
function colorRates(){
  const D=wpsGross()*prismPct(); if (D<=0) return {r:0,g:0,b:0};
  const e=prismEff(), p=S.prism;
  return {r:e*Math.sqrt(D*p.wr), g:e*Math.sqrt(D*p.wg), b:e*Math.sqrt(D*p.wb)};
}
function mixEff(){ let e=1; if (has('x1')) e*=2; if (has('x2')) e*=3; return e*(1+0.5*rl(7)); }
function pourPreview(i, frac){
  const p=PIPES[i]; const a=S[p.a]*frac, b=S[p.b]*frac; if (a<1||b<1) return 0;
  return mixEff()*Math.pow(a*b, 0.4);
}
function pour(i, frac){
  frac=frac||0.5; const p=PIPES[i]; const a=S[p.a]*frac, b=S[p.b]*frac;
  if (a<1||b<1) return 0;
  const out=mixEff()*Math.pow(a*b,0.4);
  S[p.a]-=a; S[p.b]-=b; add(p.o, out);

}

function clickValue(){

/* ================== 购买 ================== */
function genCostN(i,n){
  const g=costGrowth(); const c0=GENS[i].c*Math.pow(g,S.gens[i])/costDiv();
  return c0*(Math.pow(g,n)-1)/(g-1);
}
function genCap(i){ return inCh(3) ? Math.max(0,10-S.gens[i]) : Infinity; }
function genMaxN(i){
  const g=costGrowth(); const c0=GENS[i].c*Math.pow(g,S.gens[i])/costDiv();
  let n=Math.floor(Math.log(1+S.w*(g-1)/c0)/Math.log(g));
  if (!(n>0)) return 0;
  while (n>0 && genCostN(i,n)>S.w) n--;
  return Math.min(n, genCap(i));
}
function buyGen(i, n){
  if (n==='max') n=genMaxN(i);
  n=Math.min(n, genCap(i));
  if (!(n>0)) return false;
  const c=genCostN(i,n); if (c>S.w) return false;
  checkBaige(c);
  S.w-=c; S.gens[i]+=n; return true;
}
function upgCost(u){

}

}

/* ================== 抽 ================== */
function pullCostN(n){ return 10*Math.pow(1.5,S.pullsRun)*(Math.pow(1.5,n)-1)/0.5; }
function relicChance(){ return 0.06+0.01*rl(11); }
function pityMax(){ return 15-rl(11); }
function relicCount(){ let n=0; for (let i=1;i<=12;i++) if (rl(i)>0) n++; return n; }
function pull(n){
  const c=pullCostN(n); if (S.y<c) return null;
  S.y-=c; const res=[]; let relicsGot=0;
  for (let j=0;j<n;j++){
    S.pullsRun++; S.pullsAll++; S.pity++;
    if (S.pity>=pityMax() || Math.random()<relicChance()){
      if (S.pity>=pityMax()) unlockAch('pity');
      S.pity=0; relicsGot++;
      const idx=1+Math.floor(Math.random()*12);
      if (rl(idx)<RELIC_MAX){ S.relics[idx]=rl(idx)+1; res.push({type:'relic', idx, lv:S.relics[idx]}); }
      else { S.overflow++; res.push({type:'over', idx}); }
      continue;
    }
    const r=Math.random();
    if (r<0.62){ res.push({type:'blank'}); }
    else if (r<0.87){
      const pool=['r','g','b','y','c','m'].filter(x=>S.unl[x]);
      const cur=pick(pool); let v=10;
      if (PRIMS.includes(cur)) v+=colorRates()[cur]*60;
      else { const pi=SECS.indexOf(cur); v+=pourPreview(pi,0.25); }
      add(cur,v); res.push({type:'color', cur, v});
    } else {
      if (!S.junk.active){ spawnJunk(); res.push({type:'junk', n:S.junk.active.n}); }
      else { res.push({type:'blank'}); }
    }
  }

  return res;
}

/* ================== 生产 ================== */
function produce(sec){
  const net=wpsNet(); const before=S.w;
  add('w', net*sec);
  if (prismPct()>0){ const cr=colorRates(); add('r',cr.r*sec); add('g',cr.g*sec); add('b',cr.b*sec); }
  const ar=autoRate(); if (ar>0) add('w', clickValue()*ar*sec);
  if (kh('k13')) add('t', tRate()*sec);
  return S.w-before;
}

function tick(dt, offline){
  S.time+=dt; S.timeRun+=dt; S.idle+=dt;
  produce(dt);
  const ar=autoRate(); if (ar>0){ S.autoAcc+=ar*dt; const n=Math.floor(S.autoAcc); if (n>0){ S.autoAcc-=n; S.clicksAll+=n; S.clicks+=n; } }
  for (const k in S.buffs){ S.buffs[k].t-=dt; if (S.buffs[k].t<=0) delete S.buffs[k]; }
  if (!offline){
    if (S.junk.active){ S.junk.active.ttl-=dt; if (S.junk.active.ttl<=0){ HOOK.log(S.junk.active.n+'自己消失了。又是棍母了。'); S.junk.active=null; S.junk.next=rand(45,110); HOOK.junk(false);} }
    else if (S.wAll>=200){ S.junk.next-=dt/junkInterval(); if (S.junk.next<=0) spawnJunk(); }
  }
  // 自动化
  S.buyT+=dt;

    '<p class="small muted" style="margin-top:6px">被分走的白色不会进口袋，而是变成颜色。</p>'+
    '<div class="colorrows"></div>';
  wrap.appendChild(right);
  const svg=left.querySelector('svg'), handle=left.querySelector('.handle');
  const range=right.querySelector('input'), pv=right.querySelector('.pv');
  range.addEventListener('input',()=>{ S.prism.pct=(+range.value)/100; });
  const rows=right.querySelector('.colorrows');
  const crow={};
  for (const c of PRIMS){
    const r=h('div',{class:'crow'},'<i class="dot d-'+c+'"></i><div><span class="amt"></span><div class="ef"></div></div><span class="rt"></span>');
    rows.appendChild(r); crow[c]={amt:r.querySelector('.amt'),ef:r.querySelector('.ef'),rt:r.querySelector('.rt')};
  }
  // 拖动
  function toBary(px,py){
    const [x1,y1]=TRI.R,[x2,y2]=TRI.G,[x3,y3]=TRI.B;
    const d=(y2-y3)*(x1-x3)+(x3-x2)*(y1-y3);
    let a=((y2-y3)*(px-x3)+(x3-x2)*(py-y3))/d, b=((y3-y1)*(px-x3)+(x1-x3)*(py-y3))/d, c=1-a-b;
    a=Math.max(0,a); b=Math.max(0,b); c=Math.max(0,c); const s=a+b+c||1; a/=s; b/=s; c/=s;
    if (Math.abs(a-1/3)<0.035 && Math.abs(b-1/3)<0.035) { a=b=c=1/3; }
    return [a,b,c];
  }
  let drag=false;
  function setFrom(e){
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const [a,b,c]=toBary(p.x,p.y); S.prism.wr=a; S.prism.wg=b; S.prism.wb=c;
  }
  svg.addEventListener('pointerdown',e=>{ drag=true; svg.setPointerCapture(e.pointerId); setFrom(e); });
  svg.addEventListener('pointermove',e=>{ if (drag) setFrom(e); });
  svg.addEventListener('pointerup',()=>{ drag=false; });
  svg.addEventListener('pointercancel',()=>{ drag=false; });
  const s2=sect(el,'升级'); const cards=h('div',{class:'cards'}); s2.appendChild(cards);
  const upd=upgList(cards,'prism');
  const lr=left.querySelector('.lr'), lg=left.querySelector('.lg'), lb=left.querySelector('.lb');
  const rays={r:right.querySelector('.rr'),g:right.querySelector('.rg'),b:right.querySelector('.rb')};
  return {el, update(force){
    const p=S.prism;
    const x=p.wr*TRI.R[0]+p.wg*TRI.G[0]+p.wb*TRI.B[0], y=p.wr*TRI.R[1]+p.wg*TRI.G[1]+p.wb*TRI.B[1];
    handle.setAttribute('cx',x.toFixed(1)); handle.setAttribute('cy',y.toFixed(1));
    setT(lr,Math.round(p.wr*100)+'%'); setT(lg,Math.round(p.wg*100)+'%'); setT(lb,Math.round(p.wb*100)+'%');
    const mx=Math.round(prismMax()*100);
    if (+range.max!==mx) range.max=mx;
    if (document.activeElement!==range) range.value=Math.round(Math.min(p.pct,prismMax())*100);
    setT(pv, Math.round(prismPct()*100)+'%');
    const on=prismPct()>0;
    for (const c of PRIMS){
      const w=c==='r'?p.wr:c==='g'?p.wg:p.wb;
      rays[c].setAttribute('stroke-width', on ? (1+w*12).toFixed(1) : '1');
      rays[c].setAttribute('stroke-dasharray', on && w>0.001 ? 'none' : '3 5');
    }
    const cr=colorRates();
    setH(crow.r.amt,N('r',S.r)); setT(crow.r.ef,'摸的收获 ×'+fx(redEff()));
    setH(crow.g.amt,N('g',S.g)); setT(crow.g.ef,'全部产量 ×'+fx(greenEff()));
    setH(crow.b.amt,N('b',S.b)); setT(crow.b.ef,'白色的价格 ÷'+fx(blueEff()));
    for (const c of PRIMS) setT(crow[c].rt, '+'+fmt(cr[c])+'/秒');
    upd(force);
  }};
}

/* ===== 零 ===== */
function nextKAt(){
  const g=kGain(); const lo0=Math.max(10, Math.log10(Math.max(1,S.wTot)));
  let lo=lo0, hi=lo0+40;
  const save=S.wTot;
  for (let it=0;it<50;it++){ const mid=(lo+hi)/2; S.wTot=Math.pow(10,mid); if (kGain()>=g+1) hi=mid; else lo=mid; }
  S.wTot=save; return Math.pow(10,hi);
}
function askReset(enter){

  const title = enter ? '进入「'+CHALS[enter].n+'」' : (S.ch.cur ? '离开挑战' : '归零');

}

    });
    r.appendChild(b); box.appendChild(r); rows[i]={r,b,st:r.querySelector('.st')};
  }
  return {el, update(){
    for (let i=1;i<=5;i++){
      const o=rows[i], cur=S.ch.cur===i, done=chDone(i);
      setCls(o.r,'done',done); setCls(o.r,'cur',cur);
      setH(o.st, done?'<span class="stamp">已完成</span>':cur?'<span class="stamp">进行中</span>':'');
      if (cur) setT(o.b, done?'归零离开':'放弃');
      else setT(o.b, done?'再来一次':'进入');
      setCls(o.b,'no', !!S.ch.cur && !cur);
    }
  }};
}

/* ===== 透 ===== */
function buildTrans(){
  const el=pane('trans','透','透明的棍母。你看不见它，它就在这里。它会从你累计的黑色里慢慢渗出来。');
  const top=h('div',{class:'rowline'});
  top.innerHTML='<span class="n n-t tbig" title="棍母"></span>';
  const peek=h('label',{class:'toggle'},'<input type="checkbox"> 眯眼');
  peek.querySelector('input').addEventListener('change',e=>{ S.peek=e.target.checked; if (S.peek) unlockAch('see'); });
  top.appendChild(peek); el.appendChild(top);
  const rate=h('p',{class:'small muted',style:'margin-top:8px'}); el.appendChild(rate);
  const s=sect(el,'无形'); const cards=h('div',{class:'cards'}); s.appendChild(cards);
  const tc={};
  for (const u of TUPS){
    const b=h('button',{class:'card'},'<span class="nm">'+u.n+'</span><span class="ds">'+rich(u.d)+'</span><span class="cs"></span>');
    b.addEventListener('click',()=>{ if (buyTup(u.id)){ if (u.id!=='t5') addLog('获得了「'+u.n+'」。你看不见它。'); } });
    cards.appendChild(b); tc[u.id]=b;
  }
  const big=top.querySelector('.tbig');
  return {el, update(){
    setT(big, fmt(S.t));
    peek.querySelector('input').checked=!!S.peek;
    setH(rate,'每秒 +'+N('t',tRate())+'。看不清的话，勾上「眯眼」。');
    for (const u of TUPS){
      const b=tc[u.id], own=th(u.id);
      const lock = u.id==='t5' && !allChDone();
      setCls(b,'own',own); setCls(b,'no',!own && (S.t<u.c || lock));
      setH(b.querySelector('.cs'), own ? (u.id==='t5'?'已经是了':'已拥有') : N('t',u.c)+(lock?'　<span class="muted">（还差 '+(5-Object.keys(S.ch.done).length)+' 个「更没有」）</span>':''));
    }
  }};
}

/* ===== 录 ===== */
function buildAch(){
  const el=pane('ach','录','做过的事。大多数是什么都没做。每个成就让全部产量 ×1.03。');
  const head=h('p',{class:'small',style:'color:var(--ink-2)'}); el.appendChild(head);
  const grid=h('div',{class:'achs',style:'margin-top:12px'}); el.appendChild(grid);
  const s=sect(el,'统计'); const stats=h('dl',{class:'kv'}); s.appendChild(stats);
  let key='';
  return {el, update(force){
    const k=Object.keys(S.ach).join(',')+S.opt.fmt;
    setH(head,'已达成 '+achCount()+' / '+ACHS.length+'，全部产量 ×'+fx(achMult())+'。');
    if (k!==key||force){
      key=k; grid.innerHTML='';
      for (const a of ACHS){
        const got=!!S.ach[a.id];
        const nm = got||!a.secret ? a.n : '？？？';
        const ds = got||!a.secret ? rich(a.d) : '这个成就藏起来了。';
        grid.appendChild(h('div',{class:'ach'+(got?'':' lock')},'<div class="nm">'+nm+'</div><div class="ds">'+ds+'</div>'));
      }
    }
    setH(stats,
      '<dt>游戏时间</dt><dd>'+fmtTime(S.time)+'</dd>'+
      '<dt>这一轮</dt><dd>'+fmtTime(S.timeRun)+'</dd>'+
      '<dt>摸了</dt><dd>'+fmt(S.clicksAll)+' 次</dd>'+
      '<dt>归零</dt><dd>'+S.resets+' 次</dd>'+
      '<dt>扔掉杂物</dt><dd>'+S.junk.tossed+' 个</dd>'+
      '<dt>抽了</dt><dd>'+S.pullsAll+' 次</dd>'+
      '<dt>累计获得</dt><dd>'+N('w',S.wAll)+'</dd>'+
      '<dt>合计价值</dt><dd>棍母</dd>');
  }};
}

/* ===== 设 ===== */
function buildSet(){
  const el=pane('set','设','本游戏不含任何内容。所有货币都叫棍母，只是颜色不同。');
  const s1=sect(el,'数字');
  const segF=h('div',{class:'seg'});
  const fb=[['cn','中文单位（万、亿、兆……）'],['sci','科学计数']].map(([v,t])=>{ const b=h('button',{'aria-pressed':'false'},t); b.addEventListener('click',()=>{ S.opt.fmt=v; dirtyAll(); }); segF.appendChild(b); return [v,b]; });
  s1.appendChild(segF);
  s1.appendChild(h('p',{class:'small muted',style:'margin-top:8px'},'中文单位一路数到「无量大数」（10 的 68 次方），再往后用科学计数。'));
  const s2=sect(el,'外观');
  const segT=h('div',{class:'seg'});
  const tb=[['auto','跟随系统'],['light','白纸'],['dark','虚空']].map(([v,t])=>{ const b=h('button',{'aria-pressed':'false'},t); b.addEventListener('click',()=>{ S.opt.theme=v; applyTheme(); }); segT.appendChild(b); return [v,b]; });
  s2.appendChild(segT);
  const s3=sect(el,'归零');
  const conf=h('label',{class:'toggle'},'<input type="checkbox"> 归零前先问一句');
  conf.querySelector('input').addEventListener('change',e=>{ S.opt.confirm=e.target.checked; });
  s3.appendChild(conf);
  const s4=sect(el,'存档');
  const row=h('div',{class:'rowline'});
  const bSave=h('button',{class:'btn'},'现在保存'); bSave.addEventListener('click',()=>{ save(true); });
  const bExp=h('button',{class:'btn'},'导出'); const bImp=h('button',{class:'btn'},'导入');
  const bRst=h('button',{class:'btn'},'删档重来');
  row.append(bSave,bExp,bImp,bRst); s4.appendChild(row);
  const ta=h('textarea',{'aria-label':'存档文本',placeholder:'导出的存档会出现在这里；要导入，就把存档粘贴进来再点「导入」。',style:'margin-top:10px'}); s4.appendChild(ta);
  const note=h('p',{class:'small muted',style:'margin-top:8px'},'每 15 秒自动保存在这台设备的浏览器里。离开时也会保存；回来时，离开期间的产出按效率结算。');
  s4.appendChild(note);
  bExp.addEventListener('click',()=>{ try{ ta.value=btoa(unescape(encodeURIComponent(serialize()))); ta.select(); }catch(e){ ta.value='导出失败：'+e.message; } });
  bImp.addEventListener('click',()=>{
    const v=ta.value.trim(); if (!v) { modal('导入','先把存档文本粘贴到框里。'); return; }
    try{ const str=decodeURIComponent(escape(atob(v))); const ns=deserialize(str); S=ns; afterLoad(); save(); modal('导入','导入好了。'); }
    catch(e){ modal('导入失败','这段文本不是有效的存档。检查一下是不是复制完整了。'); }
  });
  bRst.addEventListener('click',()=>{
    modal('删档重来','所有进度都会被删除，包括黑色、空物、成就。这次是真的什么都没有了。',[{t:'算了'},{t:'删掉',solid:true,f:()=>{
      modal('再确认一次','真的删掉？',[{t:'不删了'},{t:'删',solid:true,f:()=>{ S=newState(); try{ localStorage.removeItem(SAVE_KEY); }catch(e){} afterLoad(); addLog('一切归于棍母。'); }}]);
    }}]);
  });
  return {el, update(){
    for (const [v,b] of fb) b.setAttribute('aria-pressed', S.opt.fmt===v?'true':'false');
    for (const [v,b] of tb) b.setAttribute('aria-pressed', S.opt.theme===v?'true':'false');
    conf.querySelector('input').checked=S.opt.confirm;
  }};
}

/* ---------- 结局 ---------- */
function playEnding(){
  save();
  const e=$('#ending'); e.hidden=false;
  const lines=e.querySelectorAll('.lines p'), btn=e.querySelector('.btn');
  lines.forEach(p=>p.classList.remove('on')); btn.classList.remove('on');
  lines.forEach((p,i)=>setTimeout(()=>p.classList.add('on'), 600+i*1700));
  setTimeout(()=>{ btn.classList.add('on'); btn.focus(); }, 600+lines.length*1700);
}

/* ---------- 主题 ---------- */
function applyTheme(){
  const t=S.opt.theme;
  if (t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- 存档 ---------- */
function save(manual){
  try{ localStorage.setItem(SAVE_KEY, serialize()); if (manual) addLog('保存好了。存了一堆棍母。'); }
  catch(e){ if (manual) addLog('这个浏览器不让保存。可以用「导出」手动备份。'); }
}
function load(){
  try{ const str=localStorage.getItem(SAVE_KEY); if (str) return deserialize(str); }catch(e){}
  return null;
}
function offlineProgress(){
  const now=Date.now(); const away=(now-(S.last||now))/1000;
  if (!(away>15)) return;
  const sec=Math.min(away, 12*3600);
  const eff=offlineEff();
  const before={}; for (const c of CURS) before[c]=S[c];
  const steps=Math.min(300, Math.max(10, Math.ceil(sec/30)));
  for (let i=0;i<steps;i++) tick(sec*eff/steps, true);
  const got=[]; for (const c of CURS) if (S[c]-before[c]>0.5) got.push('['+c+':'+(S[c]-before[c])+']');
  modal('你回来了', rich('你离开了 '+fmtTime(away)+(away>sec?'（最多只算 12 小时）':'')+'。离开的时候，你在发呆。<br><br>按 '+Math.round(eff*100)+'% 的效率结算，你获得了：'+(got.join(' ')||'棍母')+'。'));
}

/* ---------- 组装 ---------- */
function afterLoad(){
  applyTheme();
  $('#panel').innerHTML='';
  for (const k in PANES) delete PANES[k];
  const builders={main:buildMain,prism:buildPrism,mix:buildMix,gacha:buildGacha,idle:buildIdle,board:buildBoard,zero:buildZero,chal:buildChal,trans:buildTrans,ach:buildAch,set:buildSet};
  for (const k in builders){ const p=builders[k](); p.dirty=true; PANES[k]=p; }
  renderJunk(!!S.junk.active);
  updateRail();
  selectTab(TABS.find(t=>t.id===S.tab)&&TABS.find(t=>t.id===S.tab).show() ? S.tab : 'main');
  render(0);
}
let lastFrame=performance.now(), lastRender=performance.now(), slowT=0;
function frame(){
  const now=performance.now(); let dt=(now-lastFrame)/1000; lastFrame=now;
  if (dt>3){ const n=Math.min(120, Math.ceil(dt)); for (let i=0;i<n;i++) tick(dt/n, true); }
  else if (dt>0) tick(dt, false);
}
function render(dt){
  document.body.classList.toggle('colorless', inCh(2));
  document.body.classList.toggle('peek', !!S.peek);
  updateBank(); updateStage(dt);
  const p=PANES[S.tab]; if (p) { p.update(p.dirty); p.dirty=false; }
  slowT+=dt; if (slowT>1){ slowT=0; updateRail(); }
}
function start(){
  buildBank(); buildStage(); buildRail();
  const loaded=load();
  if (loaded) S=loaded;
  afterLoad();
  if (loaded) offlineProgress();
  else addLog('你把手伸进口袋。');
  $('#ticker').textContent=TICKS[tickIdx];
  setInterval(rotateTicker, 9000);
  setInterval(frame, 50);
  setInterval(()=>{ const now=performance.now(); render((now-lastRender)/1000); lastRender=now; }, 100);
  setInterval(()=>save(false), 15000);
  document.addEventListener('visibilitychange',()=>{ if (document.hidden) save(false); });
  window.addEventListener('pagehide',()=>save(false));
  $('#title').addEventListener('click',()=>{
    S.titleClicks=(S.titleClicks||0)+1;
    if (S.titleClicks===10){ unlockAch('seek'); addLog('你在标题里找了半天。这里什么都没有。'); }
  });
  $('#ending .btn').addEventListener('click',()=>{ $('#ending').hidden=true; S.endSeen=true; addLog('你继续摸。口袋里，还是棍母。'); });
}
start();
